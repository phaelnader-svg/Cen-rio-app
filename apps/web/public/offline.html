<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · Cenário Gestão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f5f2;
        color: #1d2523;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.8rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #4a5552;
        font-size: 1.1rem;
      }
      button {
        margin-top: 1.5rem;
        height: 4rem;
        padding: 0 2rem;
        border: 0;
        border-radius: 1rem;
        background: #1d4a45;
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="72" height="72" alt="" />
      <h1>Sem conexão com o servidor</h1>
      <p>Verifique o Wi-Fi da oficina. Nenhuma informação é registrada sem conexão.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
