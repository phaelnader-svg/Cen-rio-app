# HOMOLOGAÇÃO (testes, só dados fictícios) — separada da produção. Nada aqui foi publicado.
#
# Local (verificação):  docker compose -f infra/homolog/docker-compose.homolog.yml \
#                         --env-file <arquivo de variáveis> up -d --build
# Na VM (Google Cloud): imagens do Artifact Registry (CENARIO_API_IMAGE / CENARIO_WEB_IMAGE) e
#                       variáveis em /run/cenario/env, geradas a partir do Secret Manager pelo
#                       script infra/homolog/gcp/vm.sh. Veja docs/HOMOLOGACAO-GCP-PREPARACAO.md.
#
# Memória: limites para uma VM e2-small (2 GB + 2 GB de swap), medidos com painel + 4 tablets.
name: cenario-homolog

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

networks:
  interna:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cenario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: cenario_homolog
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cenario -d cenario_homolog']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 448m
    shm_size: 128m
    networks: [interna]
    logging: *logging
    # Sem porta publicada: só a API acessa o banco.

  api:
    image: ${CENARIO_API_IMAGE:-cenario-homolog-api}
    build:
      context: ../..
      dockerfile: infra/homolog/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: staging
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      # O "prisma migrate deploy" do início envia dados de uso a checkpoint.prisma.io se isto não
      # estiver definido: nenhum dado sai para serviços externos.
      CHECKPOINT_DISABLE: '1'
      # Migrations NUNCA implícitas na partida: a API só confere e recusa iniciar com pendência.
      # Aplicação explícita: "vm.sh migrar <etiqueta>" (após "vm.sh ponto-recuperacao").
      # Imagens anteriores a esta regra (ex.: fd6dc19) ignoram a variável e migram ao iniciar.
      MIGRATE_ON_START: ${CENARIO_MIGRATE_ON_START:-0}
      DATABASE_URL: postgresql://cenario:${POSTGRES_PASSWORD}@postgres:5432/cenario_homolog
      API_HOST: 0.0.0.0
      API_PORT: 4000
      ALLOWED_ORIGINS: https://${HOMOLOG_DOMAIN:?defina HOMOLOG_DOMAIN}
      TRUST_PROXY: 172.28.0.0/24
      COOKIE_SECURE: 'true'
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?defina TOKEN_HASH_SECRET}
      LOG_LEVEL: info
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_MB: 5
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
    volumes:
      - storage:/data/storage
    mem_limit: 512m
    networks: [interna]
    logging: *logging

  web:
    image: ${CENARIO_WEB_IMAGE:-cenario-homolog-web}
    build:
      context: ../..
      dockerfile: infra/homolog/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 448m
    networks: [interna]
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - '80:80'
      - '443:443'
    environment:
      HOMOLOG_DOMAIN: ${HOMOLOG_DOMAIN}
      HOMOLOG_BASIC_USER: ${HOMOLOG_BASIC_USER:?defina HOMOLOG_BASIC_USER}
      HOMOLOG_BASIC_HASH: ${HOMOLOG_BASIC_HASH:?defina HOMOLOG_BASIC_HASH}
      HOMOLOG_GATE_TOKEN: ${HOMOLOG_GATE_TOKEN:?defina HOMOLOG_GATE_TOKEN}
    volumes:
      - ./Caddyfile.homolog:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 192m
    networks: [interna]
    logging: *logging

  # Backup diário (banco + arquivos), retenção de 14 dias no volume "backups". Imagem oficial do
  # PostgreSQL 16 (pg_dump da mesma versão do servidor) e o script do repositório, somente leitura.
  # Só depois da API saudável (migrations aplicadas): o primeiro backup já tem o schema.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://cenario:${POSTGRES_PASSWORD}@postgres:5432/cenario_homolog
      STORAGE_DIR: /data/storage
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ../../scripts:/scripts:ro
      - storage:/data/storage:ro
      - backups:/data/backups
    working_dir: /tmp
    entrypoint:
      ['bash', '-c', 'while true; do bash /scripts/backup.sh /data/backups; sleep 86400; done']
    mem_limit: 256m
    networks: [interna]
    logging: *logging

volumes:
  pgdata:
  storage:
  backups:
  caddy_data:
